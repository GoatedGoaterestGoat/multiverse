[project]
name = "compaction"
version = "0.1.0"
description = "Frontier-coherent tree compaction for agent context"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "tiktoken>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
