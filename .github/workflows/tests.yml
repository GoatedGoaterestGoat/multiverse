# mv2's unittest suite on Linux, without the Codex, Claude and Pi CLIs: their live tests skip.
# The plugin submodules (plugins/compaction, plugins/remote) are private and not fetched, so their own tests, which
# test_plugin_checkouts adds when they are there, don't run.
name: tests

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  schedule:
    - cron: "0 9 * * *"  # nightly, 09:00 UTC: the module-by-module job, when main has changed since the last
  workflow_dispatch:

# Actions are pinned by commit SHA, with the release in a comment: a tag can be moved to other code, a commit
# cannot. To update one, take the commit of its new release tag (gh api repos/OWNER/REPO/commits/TAG --jq .sha).
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    # Not on a schedule: the push to main already ran these for the same commit.
    if: github.event_name != 'schedule'
    name: suite (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15  # about 3.5 minutes; a hang fails the run instead of holding it
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]  # oldest supported, development version, and built-in zstd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux && tmux -V
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22  # test_pi_bridge
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: Install mv2
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Run the tests
        run: .venv/bin/python tests/run.py -v  # -v: each test by name, skipped ones with their reason

  changed:
    # A nightly tests main only when it has moved since the last nightly; the same commit again proves nothing new.
    if: github.event_name == 'schedule'
    name: main changed since the last nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read  # to list this workflow's earlier scheduled runs
    outputs:
      run: ${{ steps.compare.outputs.run }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commit the last scheduled run tested; when it can't be read, run rather than skip.
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/tests.yml/runs?event=schedule&branch=main&per_page=10" \
                 --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].head_sha // ""') || last=""
          echo "last nightly tested ${last:-nothing readable}; main is ${{ github.sha }}"
          if [ "$last" = "${{ github.sha }}" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  alone:
    # Each module in a process of its own, with plain unittest: a module can pass beside the others in the suite and
    # fail alone, when nothing else imports or sets up what it relies on. tests/run.py already runs each module in its
    # own process, so this repeats the suite in another way: nightly when main has changed, and on demand.
    needs: changed
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changed.outputs.run == 'true') }}
    name: each module alone (Python 3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # about 6 minutes, 4.3 of them the modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux && tmux -V
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: Install mv2
        run: uv sync --frozen --python 3.13
      - name: Run each module alone
        working-directory: tests
        run: |
          # Several modules at once, as many as the runner has cores, each alone in its own process with its own tmux
          # and run folders, and each with its own time limit. Their output is shown in order once all have ended.
          modules=$(../.venv/bin/python run.py --list)  # the suite job's modules, as unittest discover finds them
          logs=$(mktemp -d)
          printf '%s\n' $modules | xargs -P "$(nproc)" -I{} sh -c '
            private=$(mktemp -d /tmp/mv2-alone-XXXXXX)
            TMUX_TMPDIR=$private MV2_RUN_DIR=$private/run timeout 300 ../.venv/bin/python -m unittest "$1" > "$2/$1.log" 2>&1
            echo $? > "$2/$1.code"
            rm -rf "$private"' sh {} "$logs"
          failed=()
          for module in $modules; do
            code=$(cat "$logs/$module.code" 2>/dev/null || echo "no exit code")
            echo "::group::$module"
            cat "$logs/$module.log" 2>/dev/null
            echo "::endgroup::"
            # 5 is "no tests ran": a module that only holds fixtures for others, which the suite job runs as 0 tests
            if [ "$code" != 0 ] && [ "$code" != 5 ]; then
              failed+=("$module")
              echo "::error::$module failed when run alone (exit $code)"
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed alone: ${failed[*]}"
            exit 1
          fi
