[project]
name = "multiverse-plugin"
version = "0.3.0"
description = "Multiverse plugin for Claude Code: context folding + multi-session monitor"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "textual>=0.80",
    "websockets>=13",
    "cryptography>=42",
    "certifi>=2024.7.4",
]

[project.scripts]
multiverse-mcp = "src.server:mcp.run"
multiverse-monitor = "src.monitor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
